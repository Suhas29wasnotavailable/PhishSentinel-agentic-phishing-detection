[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishsentinel"
version = "0.2.0"
description = "Deterministic core of PhishSentinel: email parsing and forensic phishing signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
phishsentinel = "phishsentinel.__main__:main"

[tool.setuptools]
packages = ["phishsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
